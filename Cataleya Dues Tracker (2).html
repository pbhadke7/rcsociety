 const tot=sum(rows,d=>d.tot),all=sum(D,d=>d.tot),avg=rows.length?tot/rows.length:0,mx=rows.reduce((m,d)=>d.tot>(m?m.tot:-1)?d:m,null);
 $('kpis').innerHTML=`
  <div class="card kpi hero"><div class="l">Total outstanding</div><div class="v">${inr(tot)}</div><div class="n">${all?Math.round(tot/all*100):0}% of all dues</div></div>
  <div class="card kpi"><div class="l">Units with dues</div><div class="v">${rows.length}</div><div class="n">of ${D.length} pending units</div></div>
  <div class="card kpi"><div class="l">Average per unit</div><div class="v">${inr(avg)}</div><div class="n">across selection</div></div>
  <div class="card kpi"><div class="l">Highest single due</div><div class="v">${mx?inr(mx.tot):'–'}</div><div class="n">${mx?esc(mx.unit):'No units'}</div></div>`;
 // wings (ignores wing filter so all bars stay visible; selected ones ringed)
 const wr=WINGS.map(w=>{const r=D.filter(d=>d.wing===w&&pass(d,'wing'));return{w,t:sum(r,d=>d.tot),n:r.length}});
 const wm=Math.max(1,...wr.map(x=>x.t));
 $('wings').innerHTML=wr.map(x=>`<button type="button" class="wb ${S.wing.has(x.w)?'sel':''}" data-w="${x.w}" data-tip="${x.w} wing: ${inr(x.t)} · ${x.n} units"><span class="nm">${x.w} wing</span><span class="trk"><i style="width:${x.t/wm*100}%"></i></span><span class="am">${short(x.t)}</span></button>`).join('');
 // occupants
 const or=OCC.map(o=>{const r=rows.filter(d=>d.occ===o);return{o,t:sum(r,d=>d.tot),n:r.length}});
 $('occ').innerHTML=tot?`<div class="stack">${or.filter(x=>x.t).map(x=>`<i style="width:${x.t/tot*100}%;background:var(${OCOL[x.o]})" data-tip="${x.o}: ${inr(x.t)} · ${x.n} units"></i>`).join('')}</div>
  <div class="leg">${or.map(x=>`<div><b style="background:var(${OCOL[x.o]})"></b><span>${x.o}<small>${x.n} units</small></span><span class="v">${inr(x.t)} <small>${tot?Math.round(x.t/tot*100):0}%</small></span></div>`).join('')}</div>`:'<div class="empty">No data</div>';
 // list
 const s=S.sort;rows.sort((a,b)=>s==='d'?b.tot-a.tot:s==='a'?a.tot-b.tot:a.unit.localeCompare(b.unit,undefined,{numeric:true}));
 const L=$('list');
 if(!rows.length)L.innerHTML='<div class="card empty">No units match these filters. Reset filters to see all units.</div>';
 else if(S.view==='cards')L.innerHTML='<div class="units">'+rows.map(d=>{
  const c=d.tot>20000?'--crit':d.tot>5000?'--warn':'--good';
  return `<div class="u"><div class="t"><span class="id">${esc(d.unit)}</span><span class="amt">${inr(d.tot)}</span></div>
  <div class="who">${esc(d.owner)||'<em>No owner</em>'}${d.tenant&&d.tenant!==d.owner?'<br><em>Tenant:</em> '+esc(d.tenant):''}</div>
  <div class="t"><span class="pill p-${d.occ}">${d.occ}</span>${d.pen?`<span class="sub">Penalty ${inr(d.pen)}</span>`:''}</div>
  <div class="band"><i style="width:${Math.min(100,d.tot/MAX*100)}%;background:var(${c})"></i></div></div>`}).join('')+'</div>';
 else L.innerHTML='<div class="tablewrap"><table><thead><tr><th>Unit</th><th>Owner</th><th>Tenant</th><th>Occupant</th><th class="num">Penalty</th><th class="num">Ledger dues</th><th class="num">Total dues</th></tr></thead><tbody>'+rows.map(d=>`<tr><td><b>${esc(d.unit)}</b></td><td>${esc(d.owner)}</td><td>${esc(d.tenant)}</td><td><span class="pill p-${d.occ}">${d.occ}</span></td><td class="num">${inr(d.pen)}</td><td class="num">${inr(d.led)}</td><td class="num"><b>${inr(d.tot)}</b></td></tr>`).join('')+`</tbody><tfoot><tr><td colspan="6"><b>Total (${rows.length} units)</b></td><td class="num"><b>${inr(tot)}</b></td></tr></tfoot></table></div>`;
}
$('wings').onclick=e=>{const b=e.target.closest('.wb');if(!b)return;const w=b.dataset.w;S.wing.has(w)?S.wing.delete(w):S.wing.add(w);T.wing=new Set(S.wing);render();renderFilters();};
$('sort').onchange=e=>{S.sort=e.target.value;render();};
$('apply').onclick=()=>{KEYS.forEach(k=>S[k]=new Set(T[k]));$('ownd').open=false;render();renderFilters();};
$('reset').onclick=()=>{KEYS.forEach(k=>{S[k]=new Set();T[k]=new Set();});$('oq').value='';$('ownd').open=false;render();renderFilters();};
$('oall').onclick=()=>{const q=$('oq').value.trim().toLowerCase();OWNERS.forEach(([n])=>{if(!q||n.toLowerCase().includes(q))T.owner.add(n)});renderFilters();};
$('oclear').onclick=()=>{T.owner.clear();renderFilters();};
$('oq').oninput=renderFilters;
$('olist').onchange=e=>{const i=e.target;if(i.type!=='checkbox')return;i.checked?T.owner.add(i.value):T.owner.delete(i.value);
 $('owns').textContent=T.owner.size?T.owner.size+' owner'+(T.owner.size>1?'s':'')+' selected':'All owners';$('ownd').classList.toggle('has',T.owner.size>0);$('apply').classList.toggle('dirty',!KEYS.every(k=>same(T[k],S[k])));};
function tab(v){S.view=v;$('t-cards').setAttribute('aria-selected',v==='cards');$('t-table').setAttribute('aria-selected',v==='table');render();}
$('t-cards').onclick=()=>tab('cards');$('t-table').onclick=()=>tab('table');
$('theme').onclick=()=>{const r=document.documentElement,d=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=d?'light':'dark';};
const tip=$('tip');
document.addEventListener('pointermove',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(!t){tip.style.opacity=0;return;}tip.textContent=t.dataset.tip;tip.style.opacity=1;tip.style.left=Math.min(innerWidth-tip.offsetWidth-8,e.clientX+12)+'px';tip.style.top=(e.clientY+14)+'px';});
const fmt=n=>Math.round(n).toLocaleString('en-IN');
function buildPdf(){
 const rows=VIEW.slice().sort((a,b)=>a.unit.localeCompare(b.unit,undefined,{numeric:true}));
 if(!rows.length)return null;
 const {jsPDF}=window.jspdf;
 const ds=new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}).replace(/ /g,'-');
 const byW={};rows.forEach(r=>(byW[r.wing]=byW[r.wing]||[]).push(r));
 const ws=Object.keys(byW).sort(),total=sum(rows,d=>d.tot),filt=KEYS.some(k=>S[k].size);
 const M=8,W=194,GAP=4,CW=(W-GAP)/2,BLUE=[31,95,214],SOFT=[227,236,252];
 let doc;
 for(const fs of [7,6.5,6,5.5,5,4.5]){
  doc=new jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
  doc.setFont('helvetica','bold');doc.setFontSize(14);doc.setTextColor(20,32,46);
  doc.text('Royal Cataleya Society Dues - Updated on '+ds,M,12);
  doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.setTextColor(100,112,126);
  doc.text('Pune  |  '+rows.length+' flats with dues  |  Total Rs. '+fmt(total)+(filt?'  |  Filtered view':''),M,16.5);
  const common={theme:'grid',styles:{font:'helvetica',fontSize:fs,cellPadding:{top:.7,bottom:.7,left:1,right:1},lineColor:[210,216,224],lineWidth:.15,textColor:[20,32,46],overflow:'linebreak'},
   headStyles:{fillColor:BLUE,textColor:255,fontStyle:'bold'},footStyles:{fillColor:SOFT,textColor:[20,32,46],fontStyle:'bold'},alternateRowStyles:{fillColor:[246,248,251]},
   margin:{top:8,bottom:6,left:M,right:M},showHead:'everyPage',showFoot:'lastPage'};
  const rightFrom=n=>({didParseCell:h=>{if(h.column.index>=n)h.cell.styles.halign='right';}});
  doc.autoTable({...common,startY:19,head:[['Wing','Total Dues (Rs.)','No. of Flats with Dues','% of Society Total']],
   body:ws.map(w=>{const t=sum(byW[w],d=>d.tot);return[w+' Wing',fmt(t),byW[w].length,(t/total*100).toFixed(1)+'%']}),
   foot:[['Grand Total',fmt(total),rows.length,'100.0%']],...rightFrom(1)});
  const cols=[{h:0,w:[],x:M},{h:0,w:[],x:M+CW+GAP}];
  [...ws].sort((a,b)=>byW[b].length-byW[a].length).forEach(w=>{const c=cols[0].h<=cols[1].h?cols[0]:cols[1];c.w.push(w);c.h+=byW[w].length+4;});
  const y0=doc.lastAutoTable.finalY+5;
  for(const c of cols){
   let y=y0;
   for(const w of c.w.sort()){
    const r=byW[w],wt=sum(r,d=>d.tot);
    doc.setFont('helvetica','bold');doc.setFontSize(fs+1.5);doc.setTextColor(20,32,46);
    doc.text(w+' Wing  -  '+r.length+' flats  |  Rs. '+fmt(wt),c.x,y+2.5);
    doc.autoTable({...common,startY:y+3.6,margin:{top:8,bottom:6,left:c.x,right:210-c.x-CW},tableWidth:CW,
     head:[['Sr. No.','Flat No.','Owner Name','Occupant','Total Dues (Rs.)','% of Wing Dues']],
     body:r.map((d,i)=>[i+1,d.unit,d.owner||'-',d.occ,fmt(d.tot),(d.tot/wt*100).toFixed(1)+'%']),
     foot:[[{content:'Wing total ('+r.length+' flats)',colSpan:4},fmt(wt),'100.0%']],
     columnStyles:{0:{cellWidth:7.5,halign:'center'},1:{cellWidth:14.5},2:{cellWidth:35},3:{cellWidth:12},4:{cellWidth:14},5:{cellWidth:12}},
     didParseCell:h=>{if(h.column.index>=4)h.cell.styles.halign='right';if(h.section==='head'&&h.column.index===0)h.cell.styles.halign='center';}});
    y=doc.lastAutoTable.finalY+3.5;
   }
  }
  if(doc.getNumberOfPages()===1)break;
 }
 return {doc,ds};
}
let DL=null;
(async()=>{try{DL=await claude.use('downloads');}catch(e){DL=null;}if(DL)$('export').hidden=false;})();
$('export').onclick=async()=>{
 const m=$('exmsg');const out=buildPdf();
 if(!out){m.textContent='No units to export. Reset filters first.';return;}
 try{await DL.save({filename:'Royal-Cataleya-Society-Dues-'+out.ds+'.pdf',data:out.doc.output('arraybuffer')});m.textContent='PDF ready: '+VIEW.length+' flats, one page.';}
 catch(e){m.textContent=e&&e.code==='declined'?'Export cancelled.':'Export is not available here.';}
};
render();renderFilters();
</script>

</body></html>
